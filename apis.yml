aid: metricwire
name: Metricwire
description: >-
  Metricwire is a real-world data collection platform for ecological momentary
  assessment (EMA), experience sampling (ESM), and digital-health research. It
  helps organizations measure real-world experiences to inform treatments,
  service offerings, and policies. Researchers design studies, schedule
  time- and event-based prompts, collect participant self-reports alongside
  passive sensor and wearable data through native iOS and Android apps, and
  export the results for analysis. The platform is used across clinical trials,
  behavioral and public-health research, and patient-reported outcome programs,
  with an emphasis on data privacy and security (ISO 27001, GDPR). A production
  JSON API is served from api.metricwire.com and a participant/researcher
  application from app.metricwire.com, though Metricwire does not currently
  publish an open developer portal or machine-readable API specification.
